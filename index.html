<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF3E8">
  <title>Hello</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="stylesheet" href="css/effects.css">
</head>
<body class="theme-home">
  <div id="bg" aria-hidden="true"></div>
  <div id="glow" aria-hidden="true"></div>
  <div id="fx" aria-hidden="true"></div>

  <header id="topbar">
    <button id="backBtn" class="chip" type="button" hidden></button>
    <button id="musicBtn" class="chip chip-icon" type="button" aria-pressed="false" aria-label="Toggle music" hidden></button>
  </header>

  <main id="stage" tabindex="-1"></main>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="preview-tag" hidden>✏️ Preview: placeholder content</div>
  <audio id="bgm" loop preload="none"></audio>
  <noscript><p style="padding:2rem;text-align:center">This little gift needs JavaScript switched on 💗</p></noscript>

  <script src="content.js"></script>
  <script src="js/util.js"></script>
  <script src="js/art.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
